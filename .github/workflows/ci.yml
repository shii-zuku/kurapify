name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack
        run: corepack enable
      - name: Install
        run: corepack pnpm --dir web install --frozen-lockfile
      - name: Typecheck
        run: corepack pnpm --dir web -r typecheck
      - name: Test
        run: corepack pnpm --dir web/app exec vitest run
      - name: Build
        env:
          VITE_PARTY_SERVER_URL: https://party.invalid
        run: corepack pnpm --dir web/app build

  desktop:
    name: Desktop files parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          for f in main preload ytauth spotify; do node --check "desktop/$f.js"; done
