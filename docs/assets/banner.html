<!doctype html>
<!--
  The README banner and the social preview, drawn in HTML so the type is the app's own (Inter). Rendered to PNG by
  render.mjs:  cd desktop && npx electron ../docs/assets/render.mjs
  banner.html          -> banner.png          (1280 x 400, shown at 2x)
  banner.html?social   -> social-preview.png  (1280 x 640, for Settings > Social preview)
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Inter Variable';
    src: url('./inter.woff2') format('woff2');
    font-weight: 100 900;
  }
  :root {
    --w: 1280px;
    --h: 400px;
    --coral: #ff5a6e;
    --crimson: #b3124f;
    --violet: #6f4cff;
  }
  html.social { --h: 640px; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: var(--w); height: var(--h); background: transparent; overflow: hidden; font-family: 'Inter Variable', Inter, system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }

  .stage { position: relative; width: var(--w); height: var(--h); overflow: hidden; border-radius: 30px; background: #0d0910; }
  .stage::after { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255,255,255,.09); pointer-events: none; }

  /* A mesh of soft colour, as the full-screen player's backdrop is. */
  .mesh { position: absolute; inset: 0; }
  .orb { position: absolute; border-radius: 50%; filter: blur(70px); }
  .orb.a { width: 560px; height: 560px; right: -70px; top: -190px; background: var(--coral); opacity: .50; }
  .orb.b { width: 520px; height: 520px; right: 150px; bottom: -330px; background: var(--crimson); opacity: .62; }
  .orb.c { width: 430px; height: 430px; right: -150px; bottom: -190px; background: var(--violet); opacity: .45; }
  .orb.d { width: 360px; height: 360px; left: -140px; top: -170px; background: #7a1c52; opacity: .38; }
  html.social .orb.a { top: -120px; }
  .tint { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(13,9,16,.76) 0%, rgba(13,9,16,.34) 54%, rgba(13,9,16,.08) 100%); }
  .grain { position: absolute; inset: 0; opacity: .5; background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px); background-size: 22px 22px; mask-image: linear-gradient(90deg, #000 0%, transparent 60%); }

  .row { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 70px 0 86px; }
  .copy { width: 620px; flex: none; }
  .lockup { display: flex; align-items: center; gap: 26px; }
  .icon { width: 108px; height: 108px; flex: none; filter: drop-shadow(0 16px 30px rgba(255,90,110,.38)); }
  h1 { font-size: 88px; line-height: .98; font-weight: 800; letter-spacing: -.045em; }
  .tag { margin-top: 22px; font-size: 24px; line-height: 1.32; font-weight: 500; letter-spacing: -.012em; color: rgba(255,255,255,.76); }
  .tag b { color: #fff; font-weight: 650; }
  .chips { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 9px; max-width: 600px; }
  .chip { height: 36px; padding: 0 15px; display: inline-flex; align-items: center; gap: 8px; border-radius: 11px; font-size: 15px; font-weight: 600; letter-spacing: -.005em; background: rgba(255,255,255,.085); box-shadow: 0 0 0 1px rgba(255,255,255,.12) inset; }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 10px var(--coral); }

  /* The app itself: real screenshots in windows, and real covers cropped from them. */
  .gfx { position: absolute; left: 704px; top: 50%; width: 540px; height: 400px; margin-top: -200px; }
  .win { position: absolute; border-radius: 14px; overflow: hidden; background: #111; box-shadow: 0 26px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.16); }
  .win img { display: block; width: 100%; height: auto; }
  .win.video { left: 118px; top: 24px; width: 420px; transform: rotate(3.2deg); }
  .win.album { left: -4px; top: 118px; width: 390px; transform: rotate(-3.4deg); }
  .win.artist { left: 92px; top: 86px; width: 440px; transform: rotate(-.6deg); box-shadow: 0 30px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.2); }
  .cover { position: absolute; width: 104px; height: 104px; border-radius: 15px; overflow: hidden; box-shadow: 0 16px 38px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.2); }
  .cover img { position: absolute; max-width: none; }
  .cover.c1 { left: -16px; top: 22px; transform: rotate(-8deg); }
  .cover.c2 { right: -2px; bottom: 34px; transform: rotate(6deg); }
  .cover.c3 { left: 236px; bottom: 22px; transform: rotate(-3deg); width: 92px; height: 92px; }

  html.social .row { padding-top: 0; }
  html.social h1 { font-size: 100px; }
  html.social .icon { width: 120px; height: 120px; }
</style>
</head>
<body>
<script>if (location.search.includes('social')) document.documentElement.classList.add('social');</script>
<div class="stage">
  <div class="mesh">
    <div class="orb d"></div><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
  </div>
  <div class="tint"></div>
  <div class="grain"></div>

  <div class="row">
    <div class="copy">
      <div class="lockup">
        <img class="icon" src="./logo.svg" alt="" />
        <h1>Kurapify</h1>
      </div>
      <p class="tag">A YouTube Music desktop player,<br/><b>dressed like Apple Music.</b></p>
      <div class="chips">
        <span class="chip"><i></i>Apple Music artwork</span>
        <span class="chip"><i></i>Artist pages</span>
        <span class="chip"><i></i>Lyrics &amp; music videos</span>
        <span class="chip"><i></i>Comments</span>
        <span class="chip"><i></i>Spotify streams</span>
      </div>
    </div>

    <div class="gfx">
      <div class="win video"><img src="../screenshots/video.png" alt="" /></div>
      <div class="win album"><img src="../screenshots/album.png" alt="" /></div>
      <div class="win artist"><img src="../screenshots/artist-page.png" alt="" /></div>
      <div class="cover c1"><img src="../screenshots/album.png" style="width:982.1px;left:-115.1px;top:-16.5px" alt="" /></div>
      <div class="cover c2"><img src="../screenshots/album.png" style="width:760.4px;left:-199.4px;top:-287.6px" alt="" /></div>
      <div class="cover c3"><img src="../screenshots/album.png" style="width:672.7px;left:-273.9px;top:-254.4px" alt="" /></div>
    </div>
  </div>
</div>
</body>
</html>
